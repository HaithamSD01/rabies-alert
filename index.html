<style>

    --green: #2F7D4F; --green-bg: #E9F4EC; --radius: 10px;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10160F; --surface: #182119; --ink: #F0F3EE; --ink-soft: #AEB8A9; --line: #2C362A;
      --teal: #43A491; --red: #FF9A8F; --red-bg: #3A1815; --amber: #E4B152; --amber-bg: #362A0E;
      --green: #86D6A2; --green-bg: #14301F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10160F; --surface: #182119; --ink: #F0F3EE; --ink-soft: #AEB8A9; --line: #2C362A;
    --teal: #43A491; --red: #FF9A8F; --red-bg: #3A1815; --amber: #E4B152; --amber-bg: #362A0E;
    --green: #86D6A2; --green-bg: #14301F;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', system-ui, sans-serif; }
  body { line-height: 1.6; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--teal); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lang-toggle { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang-toggle button { border: none; background: transparent; color: var(--ink-soft); font-family: inherit;
    font-size: 12px; font-weight: 600; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
  .lang-toggle button.active { background: var(--teal); color: #fff; }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 25px; font-weight: 800; margin: 4px 0 6px; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 18px; }

  .hero { background: var(--red-bg); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
    border-inline-start: 5px solid var(--red); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .hero-label { font-size: 12.5px; font-weight: 700; color: var(--red); margin: 0 0 6px; }
  .hero-text { margin: 0; font-size: 15.5px; font-weight: 500; }
  .emergency-note { font-size: 13.5px; color: var(--amber); background: var(--amber-bg);
    border-radius: 8px; padding: 11px 13px; margin: 0 0 16px; line-height: 1.55; }

  .btn { display: block; width: 100%; text-align: center; background: var(--teal); color: #fff; border: none;
    border-radius: var(--radius); font-family: inherit; font-size: 16px; font-weight: 700; padding: 14px 18px;
    cursor: pointer; margin-top: 8px; text-decoration: none; }
  .btn:active { opacity: 0.85; }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: 14.5px; padding: 11px 16px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 16px 0 14px; }
  .q-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
  .q-options { display: flex; flex-direction: column; gap: 10px; }
  .q-option { display: block; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); font-family: inherit; font-size: 15px; color: var(--ink); padding: 13px 15px; cursor: pointer; line-height: 1.5; }
  .q-option:active { border-color: var(--teal); }
  .progress { display: flex; gap: 6px; margin-bottom: 6px; }
  .progress span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
  .progress span.done { background: var(--teal); }

  .result-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  .result-badge.low { background: var(--green-bg); color: var(--green); }
  .result-badge.mod { background: var(--amber-bg); color: var(--amber); }
  .result-badge.high { background: var(--red-bg); color: var(--red); }
  .result-title { font-size: 21px; font-weight: 800; margin: 0 0 10px; }
  .result-text { font-size: 15.5px; margin: 0 0 8px; }
  .note { font-size: 14px; color: var(--ink-soft); background: var(--bg); border-radius: 8px; padding: 11px 13px; margin-top: 12px; }

  .field { display: block; width: 100%; font-family: inherit; font-size: 15px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .field:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .place { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .place:last-of-type { border-bottom: none; }
  .place-name { font-weight: 700; font-size: 15px; margin: 0 0 2px; }
  .place-sub { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .place-verify { font-size: 12.5px; color: var(--amber); margin: 3px 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13.5px; font-weight: 700;
    color: var(--teal); background: transparent; text-decoration: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .pill.primary { background: var(--teal); color: #fff; border-color: var(--teal); }

  details.card > summary { font-size: 17px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "＋"; color: var(--teal); font-weight: 800; }
  details.card[open] > summary::after { content: "－"; }
  .steps { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; position: relative; padding-inline-start: 38px; margin-bottom: 14px; font-size: 14.5px; }
  .steps li::before { content: counter(s); position: absolute; inset-inline-start: 0; top: 1px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--teal); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .source { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
  .dose-box { background: var(--bg); border-radius: 8px; padding: 14px; margin-top: 14px; }
  .dose-box label { font-size: 14px; font-weight: 700; display: block; margin-bottom: 6px; }
  .dose-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .dose-row:last-child { border-bottom: none; }
  .dose-row b { color: var(--teal); white-space: nowrap; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 26px 0 10px; }
  .fact { font-size: 14.5px; margin: 0 0 10px; padding-inline-start: 18px; position: relative; }
  .fact::before { content: "•"; position: absolute; inset-inline-start: 0; color: var(--teal); font-weight: 700; }
  .disclaimer { font-size: 12.5px; color: var(--ink-soft); margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }

  .sos-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .sos-bar a { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 560px; margin: 0 auto;

    border-radius: var(--radius); padding: 13px 16px; }
  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--surface); font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

    startBtn: 'Évaluer le risque maintenant',

// ─── STATE ───────────────────────────────────────────────────────────────
let lang = 'ar', screen = 'home', a1 = null, a2 = null, region = '', doseStart = '';

// ─── HELPERS ─────────────────────────────────────────────────────────────
const L = (obj) => obj[lang] || obj.ar || obj.fr;
const mapsSearch = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const mapsRoute = (q) => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(q);

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.remove('show'), 2200);
}
function copyText(text) {
  const done = () => showToast(T[lang].copiedLabel);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta);
    if (ok) done(); else window.prompt(T[lang].copyLabel, text);
  } catch (e) { window.prompt(T[lang].copyLabel, text); }
}
function riskLevel(i) { return i <= 1 ? 'low' : (i === 2 ? 'mod' : 'high'); }

// ─── SECTIONS ────────────────────────────────────────────────────────────
function renderPlaces(t) {
  let h = `<div class="card"><p class="q-title">📍 ${t.placesTitle}</p>`;
  h += `<select class="field" onchange="setRegion(this.value)">`;
  h += `<option value="" disabled ${region === '' ? 'selected' : ''}>${t.regionPrompt}</option>`;
  ['casa', 'mohammedia', 'region', 'other'].forEach(k => {
    h += `<option value="${k}" ${region === k ? 'selected' : ''}>${t.regions[k]}</option>`;
  });
  h += `</select>`;
  if (EXTERNAL_LINKS) h += `<a class="btn" href="${mapsSearch(t.qEr)}" target="_blank" rel="noopener">${t.nearMeBtn}</a>`;

  if (PLACES[region]) {
    h += `<div style="margin-top:6px;">`;
    PLACES[region].forEach((p, i) => {
      const call = p.tel ? `<a class="pill primary" href="tel:${p.tel}">📞 ${t.callLabel} <span dir="ltr">${p.telLabel}</span></a>` : '';
      const route = EXTERNAL_LINKS ? `<a class="pill" href="${mapsRoute(p.q)}" target="_blank" rel="noopener">🧭 ${t.routeLabel}</a>` : '';
      const copy = `<button class="pill" onclick="copyPlace('${region}',${i})">📋 ${t.copyLabel}</button>`;
      h += `<div class="place">
        <p class="place-name">${L(p.name)}</p>
        <p class="place-sub" dir="auto">${L(p.addr)}</p>
        ${p.hours ? `<p class="place-sub">🕐 ${L(p.hours)}</p>` : ''}
        ${p.verify ? `<p class="place-verify">${t.verifyNote}</p>` : ''}
        ${p.moh ? `<p class="source">${t.mohTag}</p>` : ''}
        <div class="actions">${call}${route}${copy}</div>
      </div>`;
    });
    h += `</div><div class="note">${t.nightNote}</div>`;
    if (!EXTERNAL_LINKS) h += `<p class="source">${t.copyHint}</p>`;
  }

  if (region === 'region') {
    h += `<p class="place-sub" style="margin:12px 0 10px;">${t.regionNote}</p>`;
    h += `<input id="regionSearch" class="field" type="search" placeholder="${t.regionSearch}" oninput="filterRegion(this.value)">`;
    h += `<div id="regionList" style="margin-top:6px;"></div>`;
    h += `<div class="note">${t.nightNote}</div>`;
    if (!EXTERNAL_LINKS) h += `<p class="source">${t.copyHint}</p>`;
  }

  if (region === 'other') {
    h += `<p class="place-sub" style="margin:12px 0 10px;">${t.otherNote}</p>`;
    h += `<input id="cityInput" class="field" type="text" placeholder="${t.otherPlaceholder}">`;
    h += `<button class="btn" onclick="cityAction('er')">${EXTERNAL_LINKS ? t.mapsErBtn : t.copyErBtn}</button>`;
    h += `<button class="btn btn-outline" onclick="cityAction('centre')">${EXTERNAL_LINKS ? t.mapsCentreBtn : t.copyCentreBtn}</button>`;
    if (!EXTERNAL_LINKS) h += `<p class="source" style="margin-top:8px;">${t.copyHint}</p>`;
  }
  return h + `</div>`;
}

const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\u064B-\u0652']/g, '').replace(/[أإآ]/g, 'ا');
let regionQuery = '';
function filterRegion(q) {
  regionQuery = q;
  const t = T[lang], box = document.getElementById('regionList');
  if (!box) return;
  const nq = norm(q.trim());
  const items = REGION_LIST.map((r, i) => ({ r, i })).filter(({ r }) => !nq || norm(r.n + ' ' + r.ar + ' ' + r.a).includes(nq));
  if (!items.length) { box.innerHTML = `<p class="place-sub" style="margin-top:10px;">${t.regionEmpty}</p>`; return; }
  box.innerHTML = items.map(({ r, i }) => {
    const title = (lang !== 'fr' && r.ar) ? `${r.ar} <span class="source" dir="ltr">${r.n}</span>` : r.n;
    const route = EXTERNAL_LINKS ? `<a class="pill" href="${mapsRoute(regionQ(r))}" target="_blank" rel="noopener">🧭 ${t.routeLabel}</a>` : '';
    return `<div class="place"><p class="place-name">${title}</p>${r.a ? `<p class="place-sub" dir="auto">${r.a}</p>` : ''}
      <div class="actions">${route}<button class="pill" onclick="copyText(regionQ(REGION_LIST[${i}]))">📋 ${t.copyLabel}</button></div></div>`;
  }).join('');
}
function regionQ(r) { return 'Centre de santé ' + r.n + (r.a ? ', ' + r.a : '') + ', Maroc'; }

function renderSteps(t, open) {
  let h = `<details class="card" ${open ? 'open' : ''}><summary>💉 ${t.stepsTitle}</summary><ol class="steps">`;
  t.steps.forEach(s => { h += `<li>${s}</li>`; });
  h += `</ol><p class="source">${t.stepsSource}</p>`;
  h += `<div class="dose-box"><label for="doseStart">🗓️ ${t.doseTitle}</label>
        <p class="place-sub" style="margin:0 0 6px;">${t.doseStartLabel}</p>
        <input id="doseStart" class="field" type="date" onchange="doseStart=this.value; calcDoses();">
        <div id="doseOut" style="margin-top:8px;"></div>
        <p class="source">${t.doseNote}</p></div>`;
  return h + `</details>`;
}

function renderFacts(t) {
  let h = `<p class="section-title">${t.factsTitle}</p>`;
  t.facts.forEach(f => { h += `<p class="fact">${f}</p>`; });
  return h + `<p class="disclaimer">${t.disclaimer}</p>`;
}

function progress(n) {
  return `<div class="progress">${[0, 1].map(i => `<span class="${i <= n ? 'done' : ''}"></span>`).join('')}</div>`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────
function render(scrollTop = true) {
  const t = T[lang];
  document.documentElement.lang = lang === 'fr' ? 'fr' : 'ar';
  document.documentElement.dir = t.dir;
  document.title = t.brand;
  document.getElementById('brandName').textContent = t.brand;
  document.getElementById('sosText').textContent = t.sos;
  ['ar', 'da', 'fr'].forEach(k => document.getElementById('btn' + k[0].toUpperCase() + k[1]).classList.toggle('active', lang === k));

  let h = '';
  if (screen === 'home') {
    h += `<h1>${t.title}</h1><p class="subtitle">${t.subtitle}</p>`;
    h += `<div class="hero"><p class="hero-label">${t.heroLabel}</p><p class="hero-text">${t.heroText}</p></div>`;
    h += `<p class="emergency-note">${t.emergencyNote}</p>`;
    h += `<button class="btn" onclick="go('q1')">${t.startBtn}</button>`;
    h += renderPlaces(t) + renderSteps(t, false) + renderFacts(t);
  } else if (screen === 'q1' || screen === 'q2') {
    const n = screen === 'q1' ? 0 : 1;
    const opts = n === 0 ? t.q1 : t.q2;
    h += progress(n);
    h += `<div class="card"><p class="q-title">${n === 0 ? t.q1Title : t.q2Title}</p><div class="q-options">`;
    opts.forEach((o, i) => { h += `<button class="q-option" onclick="answer(${n},${i})">${o}</button>`; });
    h += `</div></div><button class="btn btn-outline" onclick="go('${n === 0 ? 'home' : 'q1'}')">${t.back}</button>`;
  } else if (screen === 'result') {
    const lv = riskLevel(a1), r = t.result[lv];
    h += `<div class="card"><span class="result-badge ${lv}">${r.badge}</span>
          <p class="result-title">${r.title}</p><p class="result-text">${r.text}</p>
          <div class="note">${a2 <= 1 ? t.result.noteKnown : t.result.noteUnknown}</div></div>`;
    h += renderPlaces(t) + renderSteps(t, lv !== 'low');
    h += `<button class="btn btn-outline" onclick="restart()">${t.restart}</button>`;
    h += renderFacts(t);
  }
  document.getElementById('app').innerHTML = h;

  const rs = document.getElementById('regionSearch');
  if (rs) { rs.value = regionQuery; filterRegion(regionQuery); }
  const ds = document.getElementById('doseStart');
  if (ds) {
    if (!doseStart) { const d = new Date(); doseStart = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
    ds.value = doseStart; calcDoses();
  }
  if (scrollTop) window.scrollTo(0, 0);
}

function calcDoses() {
  const t = T[lang], out = document.getElementById('doseOut');
  if (!out || !doseStart) return;
  const base = new Date(doseStart + 'T00:00:00');
  if (isNaN(base)) { out.innerHTML = ''; return; }
  const fmt = { weekday: 'long', day: 'numeric', month: 'long' };
  out.innerHTML = [0, 7, 21].map((off, i) => {
    const d = new Date(base); d.setDate(d.getDate() + off);
    let label; try { label = d.toLocaleDateString(t.locale, fmt); } catch (e) { label = d.toDateString(); }
    return `<div class="dose-row"><span>${t.doses[i]}</span><b>${label}</b></div>`;
  }).join('');
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────
function setLang(k) { lang = k; render(false); }
function go(s) { screen = s; render(); }
function answer(n, i) { if (n === 0) { a1 = i; go('q2'); } else { a2 = i; go('result'); } }
function restart() { a1 = a2 = null; go('home'); }
function setRegion(v) { region = v; render(false); }
function copyPlace(r, i) { copyText(PLACES[r][i].q); }
function cityAction(kind) {
  const t = T[lang];
  const city = (document.getElementById('cityInput').value || '').trim();
  const q = (kind === 'er' ? t.qEr : t.qCentre) + (city ? ' ' + city : '');
  if (EXTERNAL_LINKS) window.open(mapsSearch(q), '_blank', 'noopener');
  else copyText(q);
}

render();
</script>
